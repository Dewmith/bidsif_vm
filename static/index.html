<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>BIDSIF Console</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1400px; margin: 24px; }
    h1 { margin: 0; }
    .muted { color:#666; margin-top:6px; }
    .card { border:1px solid #ddd; border-radius:12px; padding:14px; margin-top:16px; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    label { font-size: 12px; color:#444; display:block; margin-top:10px; }
    input { width:100%; padding:10px; border:1px solid #ccc; border-radius:10px; margin-top:4px; }
    button { padding:10px 14px; border:1px solid #222; border-radius:10px; background:#111; color:#fff; cursor:pointer; }
    button.secondary { background:#fff; color:#111; }
    pre { background:#111; color:#eee; padding:12px; border-radius:10px; overflow:auto; max-height: 340px; }
    table { width:100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; }
    th, td { border-bottom: 1px solid #eee; padding: 8px; text-align:left; font-size:14px; vertical-align: top; }
    th { font-size: 13px; color:#333; }
    .err { color:#b00020; font-weight:600; }
    .ok { color:#0a7a2f; font-weight:600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

    /* Table wrapper makes it horizontally scrollable if needed */
    .table-wrap { overflow-x: auto; }

    /* Truncate long text but show full value on hover (via title attr) */
    .trunc {
      max-width: 520px;
      display: inline-block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: bottom;
    }
  </style>
</head>

<body>
  <h1>BIDSIF Console</h1>
  <div class="card">
    <h3>Submit mount</h3>

    <div class="row">
      <div>
        <label>UNC path</label>
        <input id="unc" placeholder='//smb-crpn-isi-stj.univ-amu.fr/crpn$/USers/user_dir' />
      </div>
      <div>
        <label>Sub path to dataset</label>
        <input id="subdir" placeholder='sub_a/sub_b/dataset_name' />
      </div>
    </div>

    <div class="row">
      <div>
        <label>Username</label>
        <input id="username" placeholder="user.name" />
      </div>
      <div>
        <label>Password</label>
        <input id="password" type="password" placeholder="(not stored)" />
      </div>
    </div>

    <div style="display:flex; gap:10px; align-items:center; margin-top:12px;">
      <button onclick="submitMount()">Submit</button>
      <button class="secondary" onclick="clearFields()">Clear</button>
      <span id="status" class="muted"></span>
    </div>

    <h4 style="margin-top:14px; margin-bottom:8px;">Response</h4>
    <pre id="out">{}</pre>
  </div>

  <div class="card">
    <h3>Process Database</h3>
    <div class="muted">Auto-refresh every 2 seconds. Hover long fields to see the full value.</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width: 240px;">created_at</th>
            <th style="width: 140px;">username</th>
            <th style="width: 280px;">mount_id</th>
            <th style="width: 220px;">subdir</th>
            <th style="width: 520px;">reference output path</th>
            <th style="width: 110px;">status</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="6" class="muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

<script>
  async function api(path, opts={}) {
    const res = await fetch(path, {
      headers: {"Content-Type":"application/json"},
      ...opts
    });
    const text = await res.text();
    let data;
    try { data = text ? JSON.parse(text) : null; } catch { data = text; }
    if (!res.ok) throw {status: res.status, detail: data};
    return data;
  }

  function esc(s){
    return (s ?? "").toString()
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;");
  }

  // If the backend doesn't store reference_output_path in DB, we compute it here.
  function computeReferenceOutputPath(unc, subdir) {
    const u = (unc || "").trim().replaceAll("\\", "/").replace(/^\/+|\/+$/g, "");
    const parts = u.split("/");

    let idx = -1;
    for (let i = 0; i < parts.length; i++) {
      if ((parts[i] || "").toLowerCase() === "users") { idx = i; break; }
    }
    const base = idx >= 0 ? parts.slice(idx).join("/") : parts.slice(-2).join("/");

    const s = (subdir || "").trim().replaceAll("\\", "/").replace(/^\/+|\/+$/g, "");
    if (!s) return `${base}/BIDSIFied_ROOT`;

    const sp = s.split("/");
    const parent = sp.slice(0, -1).join("/");
    const last = sp[sp.length - 1];
    return parent ? `${base}/${parent}/BIDSIFied_${last}` : `${base}/BIDSIFied_${last}`;
  }

  function clearFields() {
    document.getElementById("unc").value = "";
    document.getElementById("subdir").value = "";
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";

    document.getElementById("status").textContent = "";
    document.getElementById("out").textContent = "{}";
  }

  async function submitMount(){
    const status = document.getElementById("status");
    const out = document.getElementById("out");
    status.textContent = "Submitting…";
    out.textContent = "";

    const payload = {
      unc: document.getElementById("unc").value.trim(),
      subdir: document.getElementById("subdir").value.trim(),
      username: document.getElementById("username").value.trim(),
      password: document.getElementById("password").value
    };

    // If absolutely nothing is entered
    const nothingEntered =
      !payload.unc && !payload.subdir && !payload.username && !payload.password;

    if (nothingEntered) {
      status.innerHTML = '<span class="err">Enter data before submission.</span>';
      out.textContent = "Enter data before submission.";
      return;
    }

    // Keep your rule: subdir is required
    if (!payload.subdir) {
      status.innerHTML = '<span class="err">Subdirectory is required.</span>';
      out.textContent = "Please enter a subdirectory (e.g. sub_a/sub_b/dataset_name).";
      return;
    }

    try {
      const data = await api("/submit", {method:"POST", body: JSON.stringify(payload)});
      status.innerHTML = '<span class="ok">OK</span>';
      out.textContent = JSON.stringify(data, null, 2);
      document.getElementById("password").value = "";
      await refreshMounts();
    } catch(e){
      status.innerHTML = `<span class="err">Error (${e.status})</span>`;
      out.textContent = JSON.stringify(e.detail, null, 2);
    }
  }

  async function refreshMounts(){
    const rowsEl = document.getElementById("rows");
    try{
      const rows = await api("/mounts");
      if (!rows || rows.length === 0){
        rowsEl.innerHTML = `<tr><td colspan="6" class="muted">No rows yet.</td></tr>`;
        return;
      }

      rowsEl.innerHTML = rows.map(r => {
        const refOut = r.reference_output_path || computeReferenceOutputPath(r.unc, r.subdir);
        return `
          <tr>
            <td class="mono">${esc(r.created_at)}</td>
            <td>${esc(r.username)}</td>
            <td class="mono"><span class="trunc" title="${esc(r.mount_id)}">${esc(r.mount_id)}</span></td>
            <td><span class="trunc" title="${esc(r.subdir)}">${esc(r.subdir)}</span></td>
            <td class="mono"><span class="trunc" title="${esc(refOut)}">${esc(refOut)}</span></td>
            <td>${esc(r.status)}</td>
          </tr>
        `;
      }).join("");
    } catch(e){
      rowsEl.innerHTML = `<tr><td colspan="6" class="err">Failed: ${esc(JSON.stringify(e.detail))}</td></tr>`;
    }
  }

  refreshMounts();
  setInterval(refreshMounts, 2000);
</script>
</body>
</html>
